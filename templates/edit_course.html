<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Edit Course</title>
</head>

<body>

    <h1>Edit Course</h1>

    <form action="/update_course/{{ course.course_id }}" method="POST">

        <label>Course Name:</label><br>
        <input type="text" name="course_name" value="{{ course.course_name }}" required>
        <br><br>

        <label>Duration:</label><br>
        <input type="text" name="duration" value="{{ course.duration }}" required>
        <br><br>

        <label>Eligibility:</label><br>
        <input type="text" name="eligibility" value="{{ course.eligibility }}" required>
        <br><br>

        <label>Fees:</label><br>
        <input type="number" step="0.01" name="fees" value="{{ course.fees }}" required>
        <br><br>

        <button type="submit">Update Course</button>

    </form>

    <br>

    <a href="/admin/dashboard">Back to Dashboard</a>

</body>

</html>
