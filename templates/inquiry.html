<!DOCTYPE html>
<html>

<head>

    <title>Student Inquiry</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- =========================
     NAVIGATION
========================= -->

    <nav>

        <a href="/">Home</a>
        <a href="/courses">Courses</a>
        <a href="/admission">Admission</a>
        <a href="/inquiry">Inquiry</a>
        <a href="/admin">Admin Login</a>

    </nav>


    <!-- =========================
     PAGE HEADER
========================= -->

    <section class="hero" style="min-height: 300px;">

        <div>

            <h1>Have a Question?</h1>

            <p>
                We're here to help.
                Send us your inquiry and get information about our courses
                and admission process.
            </p>

        </div>

    </section>


    <!-- =========================
     INQUIRY FORM
========================= -->

    <h1>Student Inquiry Form</h1>

    <form action="/inquiry" method="POST">

        <label>Student Name</label>

        <input type="text" name="student_name" placeholder="Enter your full name" required>


        <label>Email Address</label>

        <input type="email" name="email" placeholder="Enter your email address" required>


        <label>Mobile Number</label>

        <input type="tel" name="mobile" placeholder="Enter your mobile number" required>


        <label>Select Course</label>

        <select name="course" required>

            <option value="">
                -- Select a Course --
            </option>

            {% for course in courses %}

            <option value="{{ course.course_name }}">
                {{ course.course_name }}
            </option>

            {% endfor %}

        </select>


        <label>Your Message</label>

        <textarea name="message" placeholder="Write your question here..." required></textarea>


        <button type="submit">
            Send Inquiry
        </button>

    </form>


    <!-- =========================
     FOOTER
========================= -->

    <footer>

        <h3 style="color:white;">
            College Admission System
        </h3>

        <p>
            Have questions? We're here to help.
        </p>

        <p>
            © 2026 College Admission System
        </p>

    </footer>


</body>

</html>
